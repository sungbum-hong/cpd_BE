server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/cpd?ussSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  security:
    oauth2:
     client:
       registration:
         kakao:
           client-name: kakao
           client-id: ${KAKAO_CLIENT_ID}
           client-secret: ${KAKAO_SECRET}
           redirect-uri: http://localhost:8080/login/oauth2/code/kakao
           authorization-grant-type: authorization_code
           client-authentication-method: client_secret_post
           scope:
             - profile_nickname
             - account_email

       provider:
         kakao:
           authorization-uri: https://kauth.kakao.com/oauth/authorize
           token-uri: https://kauth.kakao.com/oauth/token
           user-info-uri: https://kapi.kakao.com/v2/user/me
           user-name-attribute: id

jwt:
  secret: dgsaljklkdsagjldsajglajlk124asdf5125126tdsaaa
  expiration: 3600000
